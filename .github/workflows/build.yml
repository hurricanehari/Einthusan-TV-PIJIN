name: Build Einthusan TV PIJIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: EinthusanTV-PIJIN-Edition

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Einthusan-TV-PIJIN-APK
          path: EinthusanTV-PIJIN-Edition/app/build/outputs/apk/debug/*.apk
