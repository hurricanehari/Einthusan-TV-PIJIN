name: Build Elil TV v0.7.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ElilTV-PIJIN-v071/**'
      - '.github/workflows/build-v071.yml'

jobs:
  build:
    name: Build Elil v0.7.1
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ElilTV-PIJIN-v071
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-extracted
          mv /tmp/android-extracted/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
      - name: Check complete v0.7.1 source
        run: |
          test -f settings.gradle
          test -f gradle.properties
          test -f app/src/main/java/com/example/einthusantv/EinthusanClient.java
          test -f app/src/main/java/com/example/einthusantv/MainActivity.java
          test -f app/src/main/java/com/example/einthusantv/PlayerActivity.java
          test -f app/src/main/java/com/example/einthusantv/ViewingStore.java
          echo 'Elil TV v0.7.1 source located.'
      - name: Build Elil v0.7.1 APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elil-TV-PIJIN-v0.7.1-APK
          path: ElilTV-PIJIN-v071/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
