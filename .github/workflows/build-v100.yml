name: Build Signed Ezhil TV v1.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ElilTV-PIJIN-v100/**'
      - '.github/workflows/build-v100.yml'
    tags:
      - 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Signed Ezhil TV v1.0.0 APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ElilTV-PIJIN-v100

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project folder
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          test -f ElilTV-PIJIN-v100/app/build.gradle || {
            echo "Missing ElilTV-PIJIN-v100 project folder"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"

          curl -fsSL \
            'https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip' \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp/android-extracted

          mv /tmp/android-extracted/cmdline-tools \
            "$SDK_DIR/cmdline-tools/latest"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Restore signing key
        shell: bash
        env:
          ELIL_KEYSTORE_BASE64: ${{ secrets.ELIL_KEYSTORE_BASE64 }}
          ELIL_KEYSTORE_PASSWORD: ${{ secrets.ELIL_KEYSTORE_PASSWORD }}
          ELIL_KEY_PASSWORD: ${{ secrets.ELIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ELIL_KEYSTORE_BASE64" || {
            echo 'Missing ELIL_KEYSTORE_BASE64'
            exit 1
          }

          test -n "$ELIL_KEYSTORE_PASSWORD" || {
            echo 'Missing ELIL_KEYSTORE_PASSWORD'
            exit 1
          }

          test -n "$ELIL_KEY_PASSWORD" || {
            echo 'Missing ELIL_KEY_PASSWORD'
            exit 1
          }

          printf '%s' "$ELIL_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/elil-tv-release.jks"

          chmod 600 "$RUNNER_TEMP/elil-tv-release.jks"

          echo "ELIL_KEYSTORE_FILE=$RUNNER_TEMP/elil-tv-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ELIL_KEYSTORE_PASSWORD: ${{ secrets.ELIL_KEYSTORE_PASSWORD }}
          ELIL_KEY_PASSWORD: ${{ secrets.ELIL_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK='app/build/outputs/apk/release/app-release.apk'

          test -s "$APK"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" \
            dump badging "$APK" |
            grep "package: name='com.example.einthusantv' versionCode='22' versionName='1.0.0'"

          cp "$APK" "$GITHUB_WORKSPACE/Elil-TV.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ezhil-TV-v1.0.0-SIGNED
          path: Elil-TV.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed APK
        if: github.ref == 'refs/tags/v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Elil-TV.apk --clobber
          else
            gh release create v1.0.0 Elil-TV.apk \
              --title 'Ezhil TV v1.0.0 — Tamil Identity & Smart Playback' \
              --notes 'Tamil branding, redesigned launcher artwork, one-button playback with automatic quality selection, in-player quality settings, and improved film-details focus.'
          fi
