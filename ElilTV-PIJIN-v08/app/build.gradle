plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.einthusantv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.einthusantv'
        minSdk 23
        targetSdk 28
        versionCode 10
        versionName '0.8'
    }

    buildFeatures {
        buildConfig true
    }

    // Temporary exemption for private Firestick sideloading.
    // Keep other Android lint checks enabled.
    lint {
        disable += ['ExpiredTargetSdkVersion']
    }

    signingConfigs {
        official {
            def ks = System.getenv('ELIL_KEYSTORE_FILE')

            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ELIL_KEYSTORE_PASSWORD')
                keyAlias 'elil-tv'
                keyPassword System.getenv('ELIL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.official
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
